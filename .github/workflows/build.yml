name: Build and Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  nix-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: fzakaria
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build & check
        run: |
          nix fmt -- --check .
          nix build
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install plotnine
        # _plugins/plotnine.rb shells out to python3 to render ```plotnine
        # fences and fails the build if it cannot. Pinned to the version the
        # flake's nixpkgs provides, so a chart drawn by this job and a chart
        # drawn by `nix build` are the same chart; see flake.nix.
        #
        # matplotlib is pinned too, and not left to pip's resolver: plotnine
        # reaches into matplotlib private API (matplotlib.text._get_textbox),
        # which newer matplotlib releases have removed. Its floor of
        # matplotlib>=3.8 is therefore not an upper bound anyone enforces.
        run: python3 -m pip install "plotnine==0.14.1" "matplotlib==3.9.2"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Lint
        run: |
          npm ci --dev
          npm run prettier-check
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
