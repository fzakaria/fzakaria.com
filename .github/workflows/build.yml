name: Build and Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  # The whole of CI. Everything the site needs -- ruby, the gems, graphviz,
  # imagemagick, the plotnine interpreter, the formatters -- is pinned in the
  # flake, so there is nothing here to install and nothing to keep in step with
  # it by hand.
  nix-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: fzakaria
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build & check
        # `nix flake check` builds the checks -- formatting -- but only
        # evaluates `packages`, so the site build is its own step.
        run: |
          nix flake check
          nix build
