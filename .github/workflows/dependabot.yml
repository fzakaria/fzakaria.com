# https://github.com/dependabot/dependabot-core/issues/5962#issuecomment-1303781931
# https://github.com/nabondance/Trailhead-Stats/blob/4e22be6714904bc6a5053c7f70f6b220be8ab252/.github/workflows/dependabot-build-deps.yml
name: Dependabot lock updates
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
jobs:
  relock-dependabot:
    if: ${{ github.actor == 'dependabot[bot]' }}
    outputs:
      package-ecosystem: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/checkout@v7
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'bundler' }}
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: "${{ secrets.PAT_TOKEN }}"
      - name: Install Nix
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'bundler' }}
        uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'bundler' }}
        with:
          name: fzakaria
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # Dependabot's Bundler writes the lock without checksums or the other
      # platforms; the lock tool adds both.
      - name: Relock with checksums
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'bundler' }}
        run: nix run .#lock
      - name: git update
        if: ${{ steps.dependabot-metadata.outputs.package-ecosystem == 'bundler' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Gemfile.lock
          git commit -m "[dependabot skip] relock with checksums"
          git push
