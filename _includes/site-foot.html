<footer class="site-foot column">
  <span>
    <a href="https://github.com/fzakaria/fzakaria.com/tree/{{ site.commit_hash }}/{{ page.path }}"
      ><span class="foot-edit__long">Improve this page</span><span class="foot-edit__short">Edit</span> @
      {{- ' ' -}}
      {{- site.commit_hash | slice: 0, 7 -}}
    </a>
  </span>
  <span class="sep" aria-hidden="true">·</span>
  <span>Text is <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA</a></span>
  <span class="sep" aria-hidden="true">·</span>
  <span>
    <a class="rss" href="{{ '/feed.xml' | relative_url }}" title="Subscribe via RSS">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 11a9 9 0 0 1 9 9h-2.5A6.5 6.5 0 0 0 4 13.5V11z" />
        <path d="M4 4a16 16 0 0 1 16 16h-2.5A13.5 13.5 0 0 0 4 6.5V4z" />
        <circle cx="5.5" cy="18.5" r="2" />
      </svg>
      RSS
    </a>
  </span>
  {%- if site.nix_store_path %}
    <span class="store-path-row"
      ><code class="store-path" title="This site was built by Nix">{{ site.nix_store_path }}</code></span
    >
  {%- endif %}
</footer>
