<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
    {% seo %}
    {% feed_meta %}
    {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

    <!-- Fonts are self-hosted, so there is no third-party DNS + TLS before first paint. -->
    <link rel="preload" href="/assets/fonts/Newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" type="text/css" href="/assets/css/base.css">

    <link rel="icon" type="image/x-icon" href="/assets/images/avatar.ico">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">

    {% if site.google_analytics and jekyll.environment == 'production' %}
      <!-- Global site tag (gtag.js) - Google Analytics -->
      <script
        async
        src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
      ></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', '{{ site.google_analytics }}');
      </script>
    {% endif %}
  </head>
  <body
    {% if page.collection == 'old_blog' or page.url == '/old_blog/' %}
      class="archive"
    {% endif %}
  >
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="wrap">
      {% include masthead.html %}
      <main id="main">{{ content }}</main>
      {% include site-foot.html %}
    </div>
  </body>
</html>
